<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Personal blog{% endblock %}</title>
    <link rel="stylesheet" href="{% static css/style.cc %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="topbarmenu">
        {% include "includes/navbar.html" %}
    </header>
    <div class="layout">     
        {% block sidebar %}{% endblock %}
        <main class="content">
            {% block page %}{% endblock %}
        </main>
    </div>
    <footer class="footer">
        {% include "includes/footer.html" %}
    </footer>
</body>
</html>
